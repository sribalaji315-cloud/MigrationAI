# Production stack. Differs from docker-compose.yml (development) in that:
#  - the database port is NOT published to the host
#  - credentials come from the environment with no insecure defaults
#  - the backend runs without --reload and honours proxy headers
#  - Caddy terminates TLS in front of everything (HSTS enabled)
#  - Redis backs the login rate limiter across workers
#
# Required env (e.g. in a root .env, never committed):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, SECRET_KEY,
#   ADMIN_EMAIL, ADMIN_PASSWORD, PUBLIC_APP_ORIGIN (e.g. https://app.example.com)
version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: '15'
      ALLOWED_ORIGINS: ${PUBLIC_APP_ORIGIN:?set PUBLIC_APP_ORIGIN}
      ALLOWED_ORIGIN_REGEX: ''
      COOKIE_SECURE: 'true'
      COOKIE_SAMESITE: 'lax'
      TRUST_PROXY_HEADERS: 'true'
      REDIS_URL: redis://redis:6379/0
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    # No --reload; trust the proxy's forwarded client IP for rate limiting.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000
             --proxy-headers --forwarded-allow-ips='*'"
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_SQL_API_ENDPOINT: ${PUBLIC_API_ORIGIN:?set PUBLIC_API_ORIGIN}
    expose:
      - "80"
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  db_data:
  caddy_data:
  caddy_config:
